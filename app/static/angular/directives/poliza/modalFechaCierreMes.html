<div class="modal fade" id="modalCierreMes" role="dialog" tabindex="-1" aria-labelledby="demo-default-modal" aria-hidden="true">
    <div class="modal-dialog modal-xs">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><i class="pci-cross pci-circle"></i></button>
                <h4 class="modal-title">Seleccione la fecha de creación:</h4>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-12 alert alert-warning">
                        <div class="radio">
                            <label>
                                <input type="radio" value="{{fechaCierreMes}}" ng-model="fechaSeleccionada">
                                {{fechaCierreMes}}
                            </label>
                        </div>
                        <div class="radio">
                            <label>
                                <input type="radio" value="{{fechaDiaHoy}}" ng-model="fechaSeleccionada">
                                {{fechaDiaHoy}}
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <div class="row">
                    <div class="col-sm-12">
                        <button type="button" class="btn btn-danger" data-dismiss="modal">Cerrar</button>
                        <button type="button" class="btn btn-success" ng-click="cancelarConFecha(fechaSeleccionada)">Aceptar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
